name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Report runs end to end on synthetic data
        run: python -m patchwork weekly --entries data/sample_entries.json --today 2026-10-25 --output output --profile rules.json